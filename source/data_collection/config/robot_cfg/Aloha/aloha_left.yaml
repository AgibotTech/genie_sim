# Lula robot_description for Aloha, left-arm IK.

api_version: 1.0

cspace:
    - arm_fl_joint1
    - arm_fl_joint2
    - arm_fl_joint3
    - arm_fl_joint4
    - arm_fl_joint5
    - arm_fl_joint6

default_q: [
    0.0, 1.57, -2.697, 0.0, 0.0, 0.0
]

acceleration_limits: [
    10, 10, 10, 10, 10, 10
]

jerk_limits: [
    10000, 10000, 10000, 10000, 10000, 10000
]

cspace_to_urdf_rules:
    - {name: arm_fr_joint1, rule: fixed, value: 0.0}
    - {name: arm_fr_joint2, rule: fixed, value: 1.57}
    - {name: arm_fr_joint3, rule: fixed, value: -2.697}
    - {name: arm_fr_joint4, rule: fixed, value: 0.0}
    - {name: arm_fr_joint5, rule: fixed, value: 0.0}
    - {name: arm_fr_joint6, rule: fixed, value: 0.0}
    - {name: gripper_fl_active_joint, rule: fixed, value: 0.04}
    - {name: gripper_fl_passive_joint, rule: fixed, value: -0.04}
    - {name: gripper_fr_active_joint, rule: fixed, value: 0.04}
    - {name: gripper_fr_passive_joint, rule: fixed, value: -0.04}

