  robot_name: G2_crsB_wuji
  robot_prefix: genie
  robot_source:
    arm: crsB
    body: g2
    gripper: wuji
    robot_model: genie
    package: genie_sim_robot_model
    pin_base_to_world: true
    convert_joints_to_fixed:
    - base
    - head
    - body
    urdf:
      inertia_source: sysid
    prebaked:
