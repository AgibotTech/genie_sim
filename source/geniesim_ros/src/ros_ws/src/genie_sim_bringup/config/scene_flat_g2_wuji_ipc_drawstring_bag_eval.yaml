# Opt-in drawstring_bag evaluation, derived from scene_flat_g2_wuji_ipc_drawstring_bag.yaml.
# CPU600/barrier10 couples to launcher IPC60; only the renderer freezes snapshots.
# Robot/sysid geometry, drives and task materials retain the target canonical definition.
# Robot initial joint angles use the supplied task pose; revolute values are degrees.
# Episode owner injects a unique state_recording output directory.
