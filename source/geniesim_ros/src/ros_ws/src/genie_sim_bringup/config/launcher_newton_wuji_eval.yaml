# Wuji chef evaluation: unchanged mjxpbd working point and scene physics.
# Launch with scene_flat_g2_sp_chef_wuji_eval and headless:=false. The evaluator
# attaches to the normally assembled engine so the scene's init pose is kept.
launcher:
  physics:
    engine: genie_sim_engine_newton
    engines:
      genie_sim_engine_newton:
        package: genie_sim_engine_newton
        executable: genie_sim_engine_newton_node.py
        name: genie_sim_engine
    industrial_bridge: ""
  renders: []

genie_sim_engine:
  ros__parameters:
    physics_params_file: physics_params.yaml
    physics_engine_visualizer: isaacsim
    physics_solver: mjxpbd
    realtime_factor: 0.5
    physics_hz: 60.0
    dds_hz: 60.0
    render_hz: 30.0
    render_mode: raster
    physics_solver_substep: 24
    physics_solver_iterations: 4
    physics_solver_mass_matrix_interval: 100000
    num_envs: 1
    step_mode: lockstep
    step_lockstep_ticks: 1
    use_tf_render: true

    # Task observation only: thresholds do not change scene or solver physics.
    # Empty/absent JSON disables scoring in other launchers. Points persist;
    # earning both continues the budget so a later dropped wok still fails.
    wok_evaluation_json: >-
      {"topic":"/wuji_eval/task_progress","thresholds":{
      "lift_height_m":0.05,"stable_hold_s":0.5,
      "max_tilt_deg":45.0,
      "toss_height_m":0.10,"toss_object_fraction":0.20,
      "min_food_upward_speed_m_s":0.05,"rim_xy_margin_m":0.03,"in_pan_margin_m":0.01}}

    # Optional observer MP4. Set an unused absolute artifact path in a local
    # launcher copy; pauses add no repeated wall-clock frames, and mounted
    # sensor captures never appear in this video. Requires ffmpeg on PATH.
    newton_video_path: ""
    newton_video_fps: 30.0
    # Owned Isaac Sim process. Choose a new log path per run; the default
    # is relative to the launch working directory and refuses overwrite.
    isaac_render_log_path: wuji_isaac_render.log
    isaac_render_timeout_s: 120.0
    isaac_render_startup_timeout_s: 600.0
    isaac_render_required_meshes_json: '["/chef_noodles","/chef_pepper","/chef_carrot","/chef_ham"]'

    # Real Isaac Sim renders of mounted virtual cameras, captured while paused.
    # eye/look_at are metres and up is a direction in the body's local frame;
    # wrist camera roll follows that body. These are
    # explicit evaluation views, not claimed hardware camera calibration.
    newton_rgb_width: 640
    newton_rgb_height: 400
    newton_rgb_views_json: >-
      [{"name":"head","topic":"/wuji_eval/head/image_raw","body":"head_link3","eye":[0.10237,0.02375,0.10256],"look_at":[1.0126639146473406,0.033358399548178215,-0.31129102103793715],"up":[0.413916670380296,-0.006243205597576296,0.9102933660997188],"fov_degrees":66.24250795899331,"width":640,"height":400,"calibration":{"model":"opencvPinhole","fx":306.69110107421875,"fy":306.5507507324219,"cx":319.90093994140625,"cy":201.29141235351562,"k1":0.0,"k2":0.0,"k3":0.0,"k4":0.0,"p1":0.0,"p2":3.2653999824105995e-06}},{"name":"hand_left","topic":"/wuji_eval/hand_left/image_raw","body":"hand_l_base_link","eye":[0.04591868482678052,0.02199999934282286,-0.004108434975343633],"look_at":[0.18509178578684576,-0.09868331998979572,0.9787783257473862],"up":[0.480091486348674,-0.8598776002890614,-0.1735588581912388],"fov_degrees":93.19408866261738,"width":960,"height":768,"calibration":{"model":"opencvFisheye","fx":363.1182861328125,"fy":363.16827392578125,"cx":482.89935302734375,"cy":372.7657470703125,"k1":-0.002479762304574251,"k2":-6.387999746948481e-07,"k3":-0.0013551259180530906,"k4":0.00023899998632259667,"p1":0.0,"p2":0.0}},{"name":"hand_right","topic":"/wuji_eval/hand_right/image_raw","body":"hand_r_base_link","eye":[0.04733658977677768,-0.021999354329208146,-0.0042763585815623895],"look_at":[0.16561290883085067,0.192247632246495,0.9653157933535952],"up":[0.4686038968927356,0.8488340997575392,-0.24472649816836423],"fov_degrees":93.19408866261738,"width":960,"height":768,"calibration":{"model":"opencvFisheye","fx":363.1182861328125,"fy":363.16827392578125,"cx":482.89935302734375,"cy":372.7657470703125,"k1":-0.002479762304574251,"k2":-6.387999746948481e-07,"k3":-0.0013551259180530906,"k4":0.00023899998632259667,"p1":0.0,"p2":0.0}}]
