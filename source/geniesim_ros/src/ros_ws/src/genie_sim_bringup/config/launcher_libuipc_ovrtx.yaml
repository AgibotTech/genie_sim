# Genie Sim launcher — Independent libuipc backend, plus the
# OVRTX render backend wired to IPC's live deformable-particle channel.
#
# Same physics config as launcher_libuipc.yaml (shared by four IPC
# scenes); split into its own file rather than flipping renders on there,
# since that file's default (renders: []) is relied on by the other three
# scenes that don't want an OVRTX process auto-started.
#
# Usage:
#   ros2 launch genie_sim_bringup app.launch.py \
#     scene:=scene_flat_g2_wuji_ipc_fold_cloth \
#     launcher_config:=launcher_libuipc_ovrtx \
#     headless:=false rviz:=true

launcher:
  physics:
    engine: genie_sim_engine_libuipc
    engines:
      genie_sim_engine_libuipc:
        package: genie_sim_engine_libuipc
        executable: genie_sim_engine_libuipc_node.py
        name: genie_sim_engine
        assemble_style: registered_pipeline
        assemble_pipeline:
          name: libuipc
          modules: [genie_sim_engine_libuipc.assemble]
          robot_stage: urdf_to_usd
    industrial_bridge: ""
  renders: ["render_ovrtx"]

genie_sim_engine:
  ros__parameters:
    physics_engine: libuipc
    physics_params_file: physics_params.yaml
    physics_engine_visualizer: newton
    physics_solver: ipc
    realtime_factor: 1.0
    physics_hz: 60.0
    dds_hz: 60.0
    render_hz: 60.0
    render_mode: raster
    # SolverIPC is configured for one fixed 60 Hz step. It owns its own
    # nonlinear iterations; engine substeps must remain one.
    physics_solver_substep: 1
    physics_solver_iterations: 0

render_ovrtx:
  ros__parameters:
    plugin:
      - genie_sim_render/RosImagePublisherPlugin
    # Live deformable-particle channel (render_node.cpp's
    # on_deformable_topology/on_deformable_flat). Must match whatever
    # scene yaml's libuipc.deformable_publish.topic the physics side
    # actually publishes on. scene_flat_g2_wuji_ipc_fold_cloth.yaml
    # publishes on this topic.
    deformable_topic: /rlinf/deformable
