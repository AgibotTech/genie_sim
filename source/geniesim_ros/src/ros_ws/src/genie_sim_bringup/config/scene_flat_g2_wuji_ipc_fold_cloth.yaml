# G2 crsB + dual Wuji hands: fold cloth with SolverIPC.
# Reference g2_wuji_ipc_teleop c787a96e + supplied launch and body/head overrides.
# Needs the supplied IPC bundle at background/fold_cloth/background.usda, with its
# shared textures under background/ipc_assets/ (the usda references them as
# ../ipc_assets/<hash>/...).
# Launch:
#   ros2 launch genie_sim_bringup app.launch.py \
#     scene:=scene_flat_g2_wuji_ipc_fold_cloth \
#     launcher_config:=launcher_libuipc headless:=false

robot:
  robot_name: G2_crsB_wuji
  robot_prefix: genie
  robot_source:
    arm: crsB
    body: g2
    gripper: "wuji"
    robot_model: genie
    package: genie_sim_robot_model
    pin_base_to_world: true
    convert_joints_to_fixed: [base, head, body]  # Shared by IPC and its CPU MuJoCo model.
    urdf:
      inertia_source: sysid
    prebaked:
      usda: robot/G2_crsB_wuji/robot.usda  # Visual assets from prebaked USD
      visual_only: true  # Physics uses staged URDF (/robot/... topology); only rendering uses this prebaked USD (/genie/... topology).
  init_base_pose: {x: 0.0, y: 0.0, z: 0.0, theta: 0.0}
  # Revolute initial angles in degrees; shared by CPU MuJoCo and IPC FK.
  # Fixed body/head angles are baked into welds; this does not unlock them.
  init_joint_pos:
    # Body / waist (fixed); user-supplied radians converted to degrees.
    # Source: CLOTH_FOLD_G2_90D_STATES (geniesim_benchmark robot_init_states.py),
    # applied here via math.degrees() per component.
    idx01_body_joint1: -46.063659781496
    idx02_body_joint2: 86.15538464332637
    idx03_body_joint3: -19.564465575570807
    idx04_body_joint4: 7.5071602088539045e-06
    idx05_body_joint5: 0.0001689947590886671
    # Head (fixed); user-supplied radians converted to degrees.
    idx11_head_joint1: -7.35191893785123e-08
    idx12_head_joint2: 1.1616341453386544e-08
    idx13_head_joint3: 25.501843153130757
    # Left arm
    idx21_arm_l_joint1: 80.36682664249724
    idx22_arm_l_joint2: -14.307356910097559
    idx23_arm_l_joint3: -66.79177785577271
    idx24_arm_l_joint4: -96.62172064064379
    idx25_arm_l_joint5: -59.160188930064024
    idx26_arm_l_joint6: -8.40459558502488
    idx27_arm_l_joint7: -55.611000656177374
    # Right arm
    idx61_arm_r_joint1: -68.9067117813213
    idx62_arm_r_joint2: -14.304968051435347
    idx63_arm_r_joint3: 78.25351830197111
    idx64_arm_r_joint4: -96.62219875388568
    idx65_arm_r_joint5: 70.6340734526067
    idx66_arm_r_joint6: -8.406684769137257
    idx67_arm_r_joint7: 67.07559270635426
    # Left hand
    hand_l_thumb_joint1: 0.0
    hand_l_thumb_joint2: 0.0
    hand_l_thumb_joint3: 0.0
    hand_l_thumb_joint4: 0.0
    hand_l_index_joint1: 0.0
    hand_l_index_joint2: 0.0
    hand_l_index_joint3: 0.0
    hand_l_index_joint4: 0.0
    hand_l_middle_joint1: 0.0
    hand_l_middle_joint2: 0.0
    hand_l_middle_joint3: 0.0
    hand_l_middle_joint4: 0.0
    hand_l_ring_joint1: 0.0
    hand_l_ring_joint2: 0.0
    hand_l_ring_joint3: 0.0
    hand_l_ring_joint4: 0.0
    hand_l_pinky_joint1: 0.0
    hand_l_pinky_joint2: 0.0
    hand_l_pinky_joint3: 0.0
    hand_l_pinky_joint4: 0.0
    # Right hand
    hand_r_thumb_joint1: 0.0
    hand_r_thumb_joint2: 0.0
    hand_r_thumb_joint3: 0.0
    hand_r_thumb_joint4: 0.0
    hand_r_index_joint1: 0.0
    hand_r_index_joint2: 0.0
    hand_r_index_joint3: 0.0
    hand_r_index_joint4: 0.0
    hand_r_middle_joint1: 0.0
    hand_r_middle_joint2: 0.0
    hand_r_middle_joint3: 0.0
    hand_r_middle_joint4: 0.0
    hand_r_ring_joint1: 0.0
    hand_r_ring_joint2: 0.0
    hand_r_ring_joint3: 0.0
    hand_r_ring_joint4: 0.0
    hand_r_pinky_joint1: 0.0
    hand_r_pinky_joint2: 0.0
    hand_r_pinky_joint3: 0.0
    hand_r_pinky_joint4: 0.0

viewer_camera:
  pos: [2.2, -2.2, 1.6]
  lookat: [0.8, 0.1, 1.0]

# Head + both wrists, the three-camera obs set a VLA policy expects. Intrinsics
# and extrinsics are read off robot/G2_crsB_wuji/robot.usda, which is this
# robot's authored asset: this scene's robot.usda comes from the URDF converter
# and carries no Camera prims, so the assembler synthesizes them from the blocks
# below (_scene_impl.py synthesize_camera). Each is authored under
# /RenderOVRTX/Cameras/<link>/<Camera>, whose parent Xform the render node
# re-poses from the link's tf every frame -- the camera's own extrinsic composes
# on top, so the wrist cameras track the arms.
cameras:
- prim_path: head_link3/Head_Front_Camera
  frame_id: head_link3
  topic:
    rgb: /genie_sim/head_camera_rgb
  sensor:
    width: 640
    height: 480
    freq: 10.0
    min_range: 0.01
    max_range: 10000
  intrinsic:
    cx: 320.0
    cy: 240.0
    fx: 317.05
    fy: 377.66
    k1: 0
    k2: 0
    p1: 0
    p2: 0
    k3: 0
  extrinsic:
    xyz: [0.10237, 0.02375, 0.10256]
    wxyz: [-0.59451, -0.386832, 0.378729, 0.594544]

- prim_path: hand_l_base_link/Left_Camera
  frame_id: hand_l_base_link
  topic:
    rgb: /genie_sim/hand_left_camera_rgb
  sensor:
    width: 640
    height: 480
    freq: 10.0
    min_range: 0.01
    max_range: 10000
  intrinsic:
    cx: 320.0
    cy: 240.0
    fx: 317.05
    fy: 377.66
    k1: 0
    k2: 0
    p1: 0
    p2: 0
    k3: 0
  extrinsic:
    xyz: [0.045919, 0.022, -0.004108]
    wxyz: [-0.076393, 0.962922, 0.253427, -0.052161]

- prim_path: hand_r_base_link/Right_Camera
  frame_id: hand_r_base_link
  topic:
    rgb: /genie_sim/hand_right_camera_rgb
  sensor:
    width: 640
    height: 480
    freq: 10.0
    min_range: 0.01
    max_range: 10000
  intrinsic:
    cx: 320.0
    cy: 240.0
    fx: 317.05
    fy: 377.66
    k1: 0
    k2: 0
    p1: 0
    p2: 0
    k3: 0
  extrinsic:
    xyz: [0.047337, -0.021999, -0.004276]
    wxyz: [-0.03077, 0.24764, 0.960974, -0.119403]
lidars: []
scene: background/fold_cloth/background.usda

libuipc:
  cpu_mujoco:
    robot_self_collision: true  # Nonadjacent robot colliders; IPC remains hand-only.
    # Convex wrist housings and palm/finger-root housings overlap by design.
    # Keep other same-hand, cross-hand and arm/body collision pairs enabled.
    robot_self_collision_excludes:
      - [arm_l_link5, arm_l_link7]
      - [arm_r_link5, arm_r_link7]
      - [hand_l_base_link, hand_l_thumb_link2]
      - [hand_l_base_link, hand_l_index_link2]
      - [hand_l_base_link, hand_l_middle_link2]
      - [hand_l_base_link, hand_l_ring_link2]
      - [hand_l_base_link, hand_l_pinky_link2]
      - [hand_r_base_link, hand_r_thumb_link2]
      - [hand_r_base_link, hand_r_index_link2]
      - [hand_r_base_link, hand_r_middle_link2]
      - [hand_r_base_link, hand_r_ring_link2]
      - [hand_r_base_link, hand_r_pinky_link2]
    execution: process  # thread uses identical model/dynamics for A/B measurement.
    physics_hz: 1000.0
    timeout_s: 0.5
    viewer: {enabled: true, render_hz: 30}
    state_timeout_s: 0.5
    iterations: 50
    tolerance: 1.0e-8
    friction: 0.3
    # G2Sim position-servo gains/limits, now owned by this scene.
    drives:
      - {pattern: 'idx[26][12]_arm_[lr]_joint[12]', kp: 1500.0, kd: 50.0, force_limit: 108.0, armature: 0.05, damping: 1.0, frictionloss: 0.3}
      - {pattern: 'idx[26][345]_arm_[lr]_joint[345]', kp: 800.0, kd: 30.0, force_limit: 35.0, armature: 0.05, damping: 1.0, frictionloss: 0.3}
      - {pattern: 'idx[26][67]_arm_[lr]_joint[67]', kp: 200.0, kd: 10.0, force_limit: 18.0, armature: 0.02, damping: 1.0, frictionloss: 0.3}
      - {pattern: 'hand_[lr]_(thumb|index|middle|ring|pinky)_joint[1-4]', kp: 0.5, kd: 0.05, force_limit: 5.0, armature: 0.0005, damping: 0.0, frictionloss: 0.0}
  viewer:
    initial_camera:
      # Head camera sight direction, backed off 0.30 m; task init joints set its world pose.
      frame: head_link3
      pos: [-0.1707181743942022, 0.02086748013554654, 0.22671530631138112]
      lookat: [1.0126639146473407, 0.0333583995481782, -0.3112910210379371]
    arm_view_only: true  # OpenGL only; keep physical collisions and recording unchanged.
    collider_only: true  # Show hand/arm and task colliders, not visual meshes.
    robot_color: [1.0, 1.0, 1.0]
  solver:
    prefer: ipc
  # Captured before USD import; rebuild only these task objects in SolverIPC.
  deactivate_prims:
    - /World/Objects/ground
    - /World/Objects/table_collider
    - /World/Objects/tshirt
    - /World/robot
  objects:
    - name: table
      kind: static_mesh
      mesh_prim_path: /World/Objects/table_collider
    - name: tshirt
      kind: cloth_mesh
      mesh_prim_path: /World/Objects/tshirt/Aligned/body
      expected_particle_count: 7547
      density: 6.0
      tri_ke: 5.0e+5
      tri_ka: 5.0e+5
      edge_ke: 0.1
  contact_d_hat: 0.002
  cloth_thickness: 0.0001
  abd_kappa: 1.0e+8
  friction_rate: 0.5
  linear_system_tol_rate: 1.0e-6
  linear_system_check_interval: 50
  newton_semi_implicit: true
  newton_semi_implicit_beta_tol: 1.0e-4
  newton_max_iter: 5
  kinematic_constraint_strength: [1000.0, 1000.0]
  linear_system_solver: fused_pcg
  abd_full_block_preconditioner: false
  linear_system_graph_enable: true
  linear_system_fused_preconditioner_enable: true
  gripper_self_contact: false
  robot_static_collision: false  # CPU MuJoCo owns robot/static contact; IPC keeps object contact.
  collision_link_names:
    - hand_l_base_link
    - hand_l_thumb_link1
    - hand_l_thumb_link2
    - hand_l_thumb_link3
    - hand_l_thumb_link4
    - hand_l_thumb_pad_link
    - hand_l_index_link1
    - hand_l_index_link2
    - hand_l_index_link3
    - hand_l_index_link4
    - hand_l_index_pad_link
    - hand_l_middle_link1
    - hand_l_middle_link2
    - hand_l_middle_link3
    - hand_l_middle_link4
    - hand_l_middle_pad_link
    - hand_l_ring_link1
    - hand_l_ring_link2
    - hand_l_ring_link3
    - hand_l_ring_link4
    - hand_l_ring_pad_link
    - hand_l_pinky_link1
    - hand_l_pinky_link2
    - hand_l_pinky_link3
    - hand_l_pinky_link4
    - hand_l_pinky_pad_link
    - hand_r_base_link
    - hand_r_thumb_link1
    - hand_r_thumb_link2
    - hand_r_thumb_link3
    - hand_r_thumb_link4
    - hand_r_thumb_pad_link
    - hand_r_index_link1
    - hand_r_index_link2
    - hand_r_index_link3
    - hand_r_index_link4
    - hand_r_index_pad_link
    - hand_r_middle_link1
    - hand_r_middle_link2
    - hand_r_middle_link3
    - hand_r_middle_link4
    - hand_r_middle_pad_link
    - hand_r_ring_link1
    - hand_r_ring_link2
    - hand_r_ring_link3
    - hand_r_ring_link4
    - hand_r_ring_pad_link
    - hand_r_pinky_link1
    - hand_r_pinky_link2
    - hand_r_pinky_link3
    - hand_r_pinky_link4
    - hand_r_pinky_pad_link
  recording:
    output_dir: /tmp/newton_recording
    every_n_steps: 1
    frame_dt: 0.03333333333333333  # Output timestamp interval, independent of simulation/wall time.
    instances:
      - name: tshirt
        mesh_prim_path: /World/Objects/tshirt/Aligned/body
        particle_start: 0
        particle_count: 7547
        semantic_type: 1
        instance_id: 1

  # Live channel for a separate render process to receive IPC's solved cloth
  # particle positions -- neither separate-process render backend this repo
  # has (render_node's /tf_scene+/tf, or Isaac Sim's tf-driven Fabric writes)
  # carries anything but rigid transforms; see the migration plan section
  # 5.1.1. deformable_publisher.py publishes on <topic>_topology (once,
  # latched) and <topic>_flat (every tick). Opt-in; absent/false changes
  # nothing about this scene's physics.
  deformable_publish:
    enabled: true
    topic: /rlinf/deformable
