# G2 crsB + dual Wuji hands: drawstring bag with SolverIPC.
# Reference g2_wuji_ipc_teleop c787a96e + supplied launch and body/head overrides.
# Needs the supplied IPC bundle at background/drawstring_bag/background.usda, with its
# shared textures under background/ipc_assets/ (the usda references them as
# ../ipc_assets/<hash>/...).
# Launch:
#   ros2 launch genie_sim_bringup app.launch.py \
#     scene:=scene_flat_g2_wuji_ipc_drawstring_bag \
#     launcher_config:=launcher_libuipc headless:=false

robot:
  robot_name: G2_crsB_wuji
  robot_prefix: genie
  robot_source:
    arm: crsB
    body: g2
    gripper: "wuji"
    robot_model: genie
    package: genie_sim_robot_model
    pin_base_to_world: true
    convert_joints_to_fixed: [base, head, body]  # Shared by IPC and its CPU MuJoCo model.
    urdf:
      inertia_source: sysid
  init_base_pose: {x: 0.0, y: 0.0, z: 0.0, theta: 0.0}
  # Supplied task pose: radians converted to degrees for the engine contract.
  # Body/head remain welded at these angles; hand joint defaults are retained.
  init_joint_pos:
    idx01_body_joint1: -46.00278137105379
    idx02_body_joint2: 86.21868901128627
    idx03_body_joint3: -19.589427015522844
    idx04_body_joint4: 0.0
    idx05_body_joint5: 0.0
    idx11_head_joint1: 0.0
    idx12_head_joint2: -0.057295779513082325
    idx13_head_joint3: 25.783100780887047
    idx21_arm_l_joint1: 43.44939495705328
    idx22_arm_l_joint2: -42.08140092539893
    idx23_arm_l_joint3: -86.42386519772262
    idx24_arm_l_joint4: -87.39245035039129
    idx25_arm_l_joint5: 16.05805894101353
    idx26_arm_l_joint6: -52.63333545520525
    idx27_arm_l_joint7: -48.56728316627985
    idx61_arm_r_joint1: -43.45099923887965
    idx62_arm_r_joint2: -42.08632836243706
    idx63_arm_r_joint3: 86.42191714121918
    idx64_arm_r_joint4: -87.39147632213957
    idx65_arm_r_joint5: -16.060637251091617
    idx66_arm_r_joint6: -52.64817506209914
    idx67_arm_r_joint7: 48.38405126339701
    hand_l_thumb_joint1: 0.0
    hand_l_thumb_joint2: 0.0
    hand_l_thumb_joint3: 0.0
    hand_l_thumb_joint4: 0.0
    hand_l_index_joint1: 0.0
    hand_l_index_joint2: 0.0
    hand_l_index_joint3: 0.0
    hand_l_index_joint4: 0.0
    hand_l_middle_joint1: 0.0
    hand_l_middle_joint2: 0.0
    hand_l_middle_joint3: 0.0
    hand_l_middle_joint4: 0.0
    hand_l_ring_joint1: 0.0
    hand_l_ring_joint2: 0.0
    hand_l_ring_joint3: 0.0
    hand_l_ring_joint4: 0.0
    hand_l_pinky_joint1: 0.0
    hand_l_pinky_joint2: 0.0
    hand_l_pinky_joint3: 0.0
    hand_l_pinky_joint4: 0.0
    hand_r_thumb_joint1: 0.0
    hand_r_thumb_joint2: 0.0
    hand_r_thumb_joint3: 0.0
    hand_r_thumb_joint4: 0.0
    hand_r_index_joint1: 0.0
    hand_r_index_joint2: 0.0
    hand_r_index_joint3: 0.0
    hand_r_index_joint4: 0.0
    hand_r_middle_joint1: 0.0
    hand_r_middle_joint2: 0.0
    hand_r_middle_joint3: 0.0
    hand_r_middle_joint4: 0.0
    hand_r_ring_joint1: 0.0
    hand_r_ring_joint2: 0.0
    hand_r_ring_joint3: 0.0
    hand_r_ring_joint4: 0.0
    hand_r_pinky_joint1: 0.0
    hand_r_pinky_joint2: 0.0
    hand_r_pinky_joint3: 0.0
    hand_r_pinky_joint4: 0.0
viewer_camera:
  pos: [2.2, -2.2, 1.6]
  lookat: [0.8, 0.1, 1.0]

cameras: []
lidars: []
scene: background/drawstring_bag/background.usda

libuipc:
  cpu_mujoco:
    robot_self_collision: true  # Nonadjacent robot colliders; IPC remains hand-only.
    # Exclude overlapping convex wrist/palm housings, not entire hands.
    robot_self_collision_excludes:
      - [arm_l_link5, arm_l_link7]
      - [arm_r_link5, arm_r_link7]
      - [hand_l_base_link, hand_l_thumb_link2]
      - [hand_l_base_link, hand_l_index_link2]
      - [hand_l_base_link, hand_l_middle_link2]
      - [hand_l_base_link, hand_l_ring_link2]
      - [hand_l_base_link, hand_l_pinky_link2]
      - [hand_r_base_link, hand_r_thumb_link2]
      - [hand_r_base_link, hand_r_index_link2]
      - [hand_r_base_link, hand_r_middle_link2]
      - [hand_r_base_link, hand_r_ring_link2]
      - [hand_r_base_link, hand_r_pinky_link2]
    execution: process  # thread uses identical model/dynamics for A/B measurement.
    static_collision_margin: 0.003  # Global 3 mm; trash_can overrides this with 10 mm.
    viewer: {enabled: true, render_hz: 30}
    physics_hz: 1000.0
    timeout_s: 0.5
    state_timeout_s: 0.5
    iterations: 50
    tolerance: 1.0e-8
    friction: 0.3
    # G2Sim position-servo gains/limits, now owned by this scene.
    drives:
      - {pattern: 'idx[26][12]_arm_[lr]_joint[12]', kp: 1500.0, kd: 50.0, force_limit: 108.0, armature: 0.05, damping: 1.0, frictionloss: 0.3}
      - {pattern: 'idx[26][345]_arm_[lr]_joint[345]', kp: 800.0, kd: 30.0, force_limit: 35.0, armature: 0.05, damping: 1.0, frictionloss: 0.3}
      - {pattern: 'idx[26][67]_arm_[lr]_joint[67]', kp: 200.0, kd: 10.0, force_limit: 18.0, armature: 0.02, damping: 1.0, frictionloss: 0.3}
      - {pattern: 'hand_[lr]_(thumb|index|middle|ring|pinky)_joint[1-4]', kp: 0.5, kd: 0.05, force_limit: 5.0, armature: 0.0005, damping: 0.0, frictionloss: 0.0}
  viewer:
    initial_camera:
      # Head camera sight direction, backed off 0.30 m; task init joints set its world pose.
      frame: head_link3
      pos: [-0.1707181743942022, 0.02086748013554654, 0.22671530631138112]
      lookat: [1.0126639146473407, 0.0333583995481782, -0.3112910210379371]
    arm_view_only: true  # OpenGL only; keep physical collisions and recording unchanged.
    collider_only: true  # Show hand/arm and task colliders, not visual meshes.
    robot_color: [1.0, 1.0, 1.0]
  solver:
    prefer: ipc
  # Captured before USD import; rebuild only these task objects in SolverIPC.
  deactivate_prims:
    - /World/Objects/ground
    - /World/Objects/table_collider
    - /World/Objects/trash_can
    - /World/Objects/drawstring_bag
    - /World/Objects/bottle1
    - /World/Objects/bottle2
    - /World/robot
  # Resolve thickness, barrier, and deformable materials at the authored bag scale.
  length_scale_mesh: /World/Objects/drawstring_bag/shell
  objects:
    - name: table
      kind: static_mesh
      mesh_prim_path: /World/Objects/table_collider
    - name: trash_can
      kind: static_mesh
      mesh_prim_path: /World/Objects/trash_can/entity/body/body_collider_00
      cpu_collision: {method: coacd, threshold: 0.01, margin: 0.01}
    - name: drawstring_bag
      kind: cloth_mesh
      mesh_prim_path: /World/Objects/drawstring_bag/shell
      expected_particle_count: 1201
      volume_density: 1237.4
      tri_ke: 5357.142857142858
      tri_ka: 21428.571428571435
      edge_ke: 0.05
    - name: cord_a
      kind: tet_mesh
      mesh_prim_path: /World/Objects/drawstring_bag/cord_a
      expected_particle_count: 441
      density: 1649.8
      youngs_modulus: 4.0e+6
      poisson_ratio: 0.45
      youngs_modulus_scale_power: 2
      damping: 0.0
      particle_radius: 0.001
    - name: cord_b
      kind: tet_mesh
      mesh_prim_path: /World/Objects/drawstring_bag/cord_b
      expected_particle_count: 441
      density: 1649.8
      youngs_modulus: 4.0e+6
      poisson_ratio: 0.45
      youngs_modulus_scale_power: 2
      damping: 0.0
      particle_radius: 0.001
    - name: bottle1
      kind: rigid_mesh
      body_prim_path: /World/Objects/bottle1
      mesh_prim_path: /World/Objects/bottle1/collider_01
      density: 1000.0
    - name: bottle2
      kind: rigid_mesh
      body_prim_path: /World/Objects/bottle2
      mesh_prim_path: /World/Objects/bottle2/collider
      density: 1000.0
  contact_d_hat: 0.0009
  cloth_thickness: 0.0012
  abd_kappa: 1.0e+8
  # Keep native IPC contact friction; the reference does not override it.
  fem_mas_partition_size: 16
  linear_system_tol_rate: 1.0e-6
  linear_system_check_interval: 50
  newton_semi_implicit: true
  newton_semi_implicit_beta_tol: 1.0e-4
  newton_max_iter: 5
  kinematic_constraint_strength: [1000.0, 1000.0]
  linear_system_solver: fused_pcg
  abd_full_block_preconditioner: false
  linear_system_graph_enable: true
  linear_system_fused_preconditioner_enable: true
  gripper_self_contact: false
  robot_static_collision: false  # CPU MuJoCo owns robot/static contact; IPC keeps object contact.
  collision_link_names:
    - hand_l_base_link
    - hand_l_thumb_link1
    - hand_l_thumb_link2
    - hand_l_thumb_link3
    - hand_l_thumb_link4
    - hand_l_thumb_pad_link
    - hand_l_index_link1
    - hand_l_index_link2
    - hand_l_index_link3
    - hand_l_index_link4
    - hand_l_index_pad_link
    - hand_l_middle_link1
    - hand_l_middle_link2
    - hand_l_middle_link3
    - hand_l_middle_link4
    - hand_l_middle_pad_link
    - hand_l_ring_link1
    - hand_l_ring_link2
    - hand_l_ring_link3
    - hand_l_ring_link4
    - hand_l_ring_pad_link
    - hand_l_pinky_link1
    - hand_l_pinky_link2
    - hand_l_pinky_link3
    - hand_l_pinky_link4
    - hand_l_pinky_pad_link
    - hand_r_base_link
    - hand_r_thumb_link1
    - hand_r_thumb_link2
    - hand_r_thumb_link3
    - hand_r_thumb_link4
    - hand_r_thumb_pad_link
    - hand_r_index_link1
    - hand_r_index_link2
    - hand_r_index_link3
    - hand_r_index_link4
    - hand_r_index_pad_link
    - hand_r_middle_link1
    - hand_r_middle_link2
    - hand_r_middle_link3
    - hand_r_middle_link4
    - hand_r_middle_pad_link
    - hand_r_ring_link1
    - hand_r_ring_link2
    - hand_r_ring_link3
    - hand_r_ring_link4
    - hand_r_ring_pad_link
    - hand_r_pinky_link1
    - hand_r_pinky_link2
    - hand_r_pinky_link3
    - hand_r_pinky_link4
    - hand_r_pinky_pad_link
  recording:
    output_dir: /tmp/newton_recording
    every_n_steps: 1
    frame_dt: 0.03333333333333333  # Output timestamp interval, independent of simulation/wall time.
    instances:
      - name: drawstring_bag
        mesh_prim_path: /World/Objects/drawstring_bag/shell
        particle_start: 0
        particle_count: 1201
        semantic_type: 1
        instance_id: 1
      - name: cord_a
        mesh_prim_path: /World/Objects/drawstring_bag/cord_a
        particle_start: 1201
        particle_count: 441
        semantic_type: 1
        instance_id: 2
      - name: cord_b
        mesh_prim_path: /World/Objects/drawstring_bag/cord_b
        particle_start: 1642
        particle_count: 441
        semantic_type: 1
        instance_id: 3
