# Genie Sim launcher — Independent libuipc backend, plus Isaac
# Sim's own render backend wired to IPC's live deformable-particle channel.
#
# The Python/Fabric counterpart of launcher_libuipc_ovrtx.yaml: same
# physics config, but renders: ["render_isaacsim"] selects isaacsim_render.py
# instead of the C++ render_node. The two are drop-in swappable.
#
# Isaac Sim ships its own Python (3.11 on the 5.1 variant), so the node is
# launched through omni_python rather than the system python3 -- see
# _isaacsim_render_env in launch/utils.py, which also compensates for the two
# Isaac Sim 5.1 packaging defects (ROS2-bridge lib path, bundled numpy).
#
# Usage:
#   ros2 launch genie_sim_bringup app.launch.py \
#     scene:=scene_flat_g2_wuji_ipc_fold_cloth \
#     launcher_config:=launcher_libuipc_isaacsim \
#     headless:=false rviz:=false

launcher:
  physics:
    engine: genie_sim_engine_libuipc
    engines:
      genie_sim_engine_libuipc:
        package: genie_sim_engine_libuipc
        executable: genie_sim_engine_libuipc_node.py
        name: genie_sim_engine
        assemble_style: registered_pipeline
        assemble_pipeline:
          name: libuipc
          modules: [genie_sim_engine_libuipc.assemble]
          robot_stage: urdf_to_usd
    industrial_bridge: ""
  renders: ["render_isaacsim"]

genie_sim_engine:
  ros__parameters:
    physics_engine: libuipc
    physics_params_file: physics_params.yaml
    physics_engine_visualizer: newton
    physics_solver: ipc
    realtime_factor: 1.0
    physics_hz: 60.0
    dds_hz: 60.0
    render_hz: 60.0
    render_mode: raster
    # SolverIPC is configured for one fixed 60 Hz step. It owns its own
    # nonlinear iterations; engine substeps must remain one.
    physics_solver_substep: 1
    physics_solver_iterations: 0

render_isaacsim:
  ros__parameters:
    # Live deformable-particle channel (isaacsim_render.py's
    # DeformableChannel). Must match whatever the scene yaml's
    # libuipc.deformable_publish.topic the physics side publishes on.
    deformable_topic: /rlinf/deformable
