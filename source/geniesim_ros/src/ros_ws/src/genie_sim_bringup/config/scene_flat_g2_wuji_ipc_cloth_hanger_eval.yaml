    physics_hz: 600.0
    viewer:
      enabled: false
      render_hz: 30
    timeout_s: 0.5
    state_timeout_s: 0.5
    iterations: 50
    tolerance: 1.0e-08
    friction: 0.3
    drives:
    - pattern: idx[26][12]_arm_[lr]_joint[12]
      kp: 1500.0
      kd: 50.0
      force_limit: 108.0
      armature: 0.05
      damping: 1.0
      frictionloss: 0.3
    - pattern: idx[26][345]_arm_[lr]_joint[345]
      kp: 800.0
      kd: 30.0
      force_limit: 35.0
      armature: 0.05
      damping: 1.0
      frictionloss: 0.3
    - pattern: idx[26][67]_arm_[lr]_joint[67]
      kp: 200.0
      kd: 10.0
      force_limit: 18.0
      armature: 0.02
      damping: 1.0
      frictionloss: 0.3
    - pattern: hand_[lr]_(thumb|index|middle|ring|pinky)_joint[1-4]
      kp: 0.5
      kd: 0.05
      force_limit: 5.0
      armature: 0.0005
      damping: 0.0
      frictionloss: 0.0
