# ARX AC one / X5A — identified per-joint drive and passive parameters.
#
# Source: the accepted model of an offline system-identification run
# against ARX Real hardware.
#   armature / dof_damping / dof_frictionloss  <- the <joint> element
#   kp                                         <- actuator gainprm
#   kd                                         <- -1x biasprm[2]
#
# WHY THIS FILE EXISTS, next to the xacro params files
# ----------------------------------------------------
# Four of the five families round-trip through URDF: damping and
# frictionloss as <dynamics damping= friction=>, kp and kd as the
# custom <drive stiffness= damping=> tag.  `armature` has no URDF
# representation at all — the engine only ever reads it from the
# per-class table in genie_sim_engine_core/config/physics_params.yaml.
# So the xacro files carry four families and this file carries all
# five, keyed by joint name, in the shape a per-joint override layer
# would want.
#
# NOTHING READS THIS FILE YET.  genie_sim_engine_core's DriveParams
# loader keys off joint *class*, not joint name
# (common/params.py, usd_drive_api.<class> blocks), and the mjwarp
# adapter overwrites ke/kd/dof_damping/dof_frictionloss from that
# table unconditionally for every DOF.  AC one's twelve arm joints
# collapse into three side-blind classes there (arm_shoulder J1-J2,
# arm_mid J3-J5, arm_wrist J6), which is exactly why a name-keyed
# override layer is the prerequisite.  Consuming this file means:
#   1. a {joint_name: DriveParams} map consulted before the class
#      fallback in genie_sim_engine_core/common/params.py;
#   2. the mjwarp per-DOF loops preferring that map over cls_gains.
#
# ALSO MISSING: the command delay.  0.085 s on the left arm, 0.089 s
# on the right, applied in the sysid rollout config.  It is ~90% of
# the run's reported tracking improvement and there is no delay
# mechanism anywhere in the engine (git grep command_delay -> empty).
# Adopting the numbers below without it adopts the small half.
#
# Units: armature kg*m^2, dof_damping N*m*s/rad, dof_frictionloss N*m,
# kp N*m/rad, kd N*m*s/rad.
#
# NO max_effort IN THE SHIPPED BLOCKS.  The sysid pipeline does not
# produce an effort limit, in either of the two fields that could hold
# one: `max_effort` is the runtime drive clamp and `effort` is the
# vendor joint torque rating.  The arm's vendor limits
# (30/40/30/15/10/10 N*m) are already in the URDFs' <limit effort> and
# belong there; the overlays declare both fields not identified.
#
# The clamp the run itself applied was 27 N*m on J1-J3 and 7 N*m on
# J4-J6.  That is a CONDITION the gains were fitted under, so it is
# preserved verbatim in `arx_acone_raw_run_output` below, which is the
# raw run record.  It was never this arm's rating: both numbers are
# motor-module datasheet PEAK torques for a DM-J4340 plus DM-J4310
# pairing, which is not this arm's pairing — its J1-J3 are EC-A4310 —
# so 27 was a conservative stand-in.  It has never acted as a cap
# either: the adapter only ever raises a cap, never lowers one, so 27/7
# could not bind below the URDF limits.  A run that wants the fit's own
# saturation behaviour has to apply 27/7 itself.
#
# Fit quality, per joint, is not uniform.  Only the left arm had a
# complete fitted set -- on the right only kp was ever fitted -- which
# is why the shipped AC one block carries the left-arm values on both
# arms.  j1 armature, j3 dof_damping and j4 dof_frictionloss sit on
# their search-box edges.  See robots/arx/acone/AC1.params.sysid.xacro
# for the full caveat list.

# AC one, as shipped: the LEFT-ARM set on both arms.  The run produced
# two different per-side sets; those differences are an artifact of
# regularization, not a property of the hardware, so one side is
# carried on both.  The verbatim per-side output is kept below under
# `arx_acone_raw_run_output` as a record.
#
# The per-side differences do not survive a change of regularization --
# the free fits disagree L/R on J1 (8.1x) and J4 (18.7x) while agreeing
# within 15% on J2/J3/J5/J6, and the penalized fits do the opposite,
# agreeing on J1-J4 and disagreeing on J5 (3.6x) and J6 (11.0x).  R6's
# kp is the clearest case: the same data and normalization give 26.74
# unpenalized and 630.29 penalized, both fits reporting success, a 23x
# spread in the direction the penalty cannot produce.  The right-arm kd
# layer collapsed outright (free fit: R1 1.2e-29,
# R2 5.0e-13), so that side never had a fitted kd at all -- only kp was
# ever fitted there.  Meanwhile the two arms are mechanically identical
# in the model -- same masses, COMs, inertias and axes, mounts
# differing only by y = +/-0.25, a translation rather than a mirror --
# so nothing in the plant justifies a split.
#
# Left is the side to keep: 14 fit / 9 validation episodes with the
# towel task included versus 9 / 6 without, wider excitation, the only
# side where all five families were fitted, and validation tracking
# equal or better on every joint (the right arm is 39% worse on J5 and
# 52% worse on J6).
#
# The command delay is deliberately NOT symmetrized.  It was the
# dominant and best-identified effect in the run, the two values were
# fitted independently and agree to 4.7%, so that split is a
# measurement rather than an artifact.
arx_acone:
  arm_l_joint1: {armature: 0.241167,   dof_damping: 0.02646,   dof_frictionloss: 0.00102394, kp: 515.513, kd: 1.33108, fitted: all}
  arm_l_joint2: {armature: 0.0453454,  dof_damping: 0.0238303, dof_frictionloss: 0.00102044, kp: 526.311, kd: 2.97626, fitted: all}
  arm_l_joint3: {armature: 0.0472377,  dof_damping: 1.79972,   dof_frictionloss: 0.0142011,  kp: 507.589, kd: 6.85319, fitted: all}
  arm_l_joint4: {armature: 0.0148545,  dof_damping: 0.0101474, dof_frictionloss: 0.525452,   kp: 324.788, kd: 1.0962, fitted: all}
  arm_l_joint5: {armature: 0.0979814,  dof_damping: 0.762774,  dof_frictionloss: 0.292917,   kp: 508.681, kd: 4.60003, fitted: all}
  arm_l_joint6: {armature: 0.00416896, dof_damping: 0.527118,  dof_frictionloss: 0.278988,   kp: 57.2908, kd: 3.58765, fitted: all}
  # Right arm carries the left-arm values.
  arm_r_joint1: {armature: 0.241167,   dof_damping: 0.02646,   dof_frictionloss: 0.00102394, kp: 515.513, kd: 1.33108, fitted: all}
  arm_r_joint2: {armature: 0.0453454,  dof_damping: 0.0238303, dof_frictionloss: 0.00102044, kp: 526.311, kd: 2.97626, fitted: all}
  arm_r_joint3: {armature: 0.0472377,  dof_damping: 1.79972,   dof_frictionloss: 0.0142011,  kp: 507.589, kd: 6.85319, fitted: all}
  arm_r_joint4: {armature: 0.0148545,  dof_damping: 0.0101474, dof_frictionloss: 0.525452,   kp: 324.788, kd: 1.0962, fitted: all}
  arm_r_joint5: {armature: 0.0979814,  dof_damping: 0.762774,  dof_frictionloss: 0.292917,   kp: 508.681, kd: 4.60003, fitted: all}
  arm_r_joint6: {armature: 0.00416896, dof_damping: 0.527118,  dof_frictionloss: 0.278988,   kp: 57.2908, kd: 3.58765, fitted: all}
  # Gripper gains from the run (kp 2000, kd 200) already equal the
  # engine's gripper class defaults, so they are omitted on purpose.
  command_delay_s_left: 0.085
  command_delay_s_right: 0.089    # kept per side; see above.  No consumer exists.

# RECORD ONLY -- do not consume.  The verbatim per-side output of the
# accepted run, preserved so the raw result stays in
# the repo after symmetrization.  On the right arm only kp was fitted;
# armature, dof_damping, dof_frictionloss and kd are the stock baseline
# the run started from, not estimates.  `arx_acone` above is what the
# package ships.
arx_acone_raw_run_output:
  arm_l_joint1: {armature: 0.241167,   dof_damping: 0.02646,   dof_frictionloss: 0.00102394, kp: 515.513, kd: 1.33108, max_effort: 27.0, fitted: all}
