meta:
  kind: sysid
  identified_on: '2026-09-22'
  source_run: offline sysid run against the physical G2; supersedes the T2 v2 set (d440207856)
  not_identified:
  - effort
  - velocity
  - stiffness
  - damping_drive
  - max_effort
  - command_delay
  - torque_constant
  caveats: 'Link masses are not identifiable from this run: the L2/L3 torque derivative is ~7e-10 N*m/kg.

    Masses equal to CAD are marked frozen_to_cad.

    damping and frictionloss were NOT refit in this revision - they are carried from the previous

    one (identical to 4 decimals on all 14 joints); only inertials were revised and armature moved <=4.1%.

    The friction basis zeroes F below |v| < 0.02 rad/s, and 42.2% of J2 friction training points fall
    in

    that band without being stationary; a 0.002 threshold cuts friction training RMSE from ~3.16 to ~1.17
    N*m.

    Right L3 mass distribution is 1.37x outside its collision shell.

    Training provenance is unknown and may overlap the holdout set.

    All 14 inertials are physically consistent (min eig 1.0e-4 to 1.2e-3).

    Velocity limits are NOT carried: the sysid params file repeated the sim''s own

    3.05/3.05/3.76/3.76/3.35/3.35/3.35 rad/s verbatim, so the run measured nothing there.

    ENGINE SCOPE: THESE CONTROLLER NUMBERS ARE FLAT. The schema lets
    stiffness, damping_drive, damping and frictionloss carry one value per
    engine (mujoco / newton / physx); every one of them in this file is a
    single flat value, which the schema reads as the same number claimed for
    all three. No gains were identified at all here, so only damping and
    frictionloss are at issue, and both came from an offline friction-basis
    regression with no engine in the loop. meta.identified_on_engine is
    therefore deliberately absent rather than forgotten: that field records
    which servo law a stiffness or damping_drive was fitted against, the
    schema requires it of any sysid overlay carrying either, and this set
    carries neither. Note that frictionloss is itself a MuJoCo concept with no
    physx counterpart, which is a separate problem from the one below.

    ON PHYSX THE DAMPING MEANS SOMETHING ELSE. damping is nonzero on all 14
    joints (0.473751 to 4.159666 N*m*s/rad) while damping_drive is absent.
    physx folds passive damping into drive damping (kd + damping), so the
    whole identified viscous term is added to whatever kd the class table
    supplies and becomes a drive term proportional to the velocity ERROR,
    while the regression measured the term proportional to the absolute joint
    velocity. The two agree only while the velocity target is zero. Until the
    adapter keeps the channels apart these values are faithful on mujoco and
    newton only, and the fix belongs in the adapter: scaling them down to
    compensate would hide the bug and break the moment it is fixed.'
