# G2 crsB arm — identified per-joint passive parameters (the `sysid` set).
#
# Source: the accepted model of an offline system-identification run
# against the physical G2 (model dated 2026-09-22), bodies
# arm_{l,r}_link1..7, the joint armature / damping / frictionloss
# attributes.
#
# WHY THIS FILE EXISTS, next to the xacro params files
# ----------------------------------------------------
# Two of the three families round-trip through URDF, as <dynamics
# damping= friction=> in G2.arm.crsB.params.sysid.xacro.  `armature`
# has no URDF representation at all — the engine only ever reads it
# from the per-class table in
# genie_sim_engine_core/config/physics_params.yaml.  So the xacro file
# carries two families and this file carries all three, keyed by the
# joint names as they appear in the generated URDF (the idxNN_ prefixes
# are part of the name), in the shape a per-joint override layer would
# want.
#
# NO kp/kd HERE, AND THAT IS NOT AN OMISSION.  The run declares no
# actuator model, so it publishes no position gains and no torque
# constant — it fits on the joint-torque plane and the
# current-to-torque scale is an input to it, not an output.  The
# <drive stiffness= damping=> gains in G2.arm.crsB.urdf.xacro are the
# sim's own (40000/40000/15000/15000/15000/8000/8000 and
# 600/600/220/220/220/100/100) and are recorded below as `sim_kp` /
# `sim_kd` so the whole per-joint picture reads from one file.  They
# are NOT identified values.
#
# NOTHING READS THIS FILE YET.  Same blocker as the arx sidecar:
# genie_sim_engine_core's DriveParams loader keys off joint *class*,
# not joint name (common/params.py, usd_drive_api.<class> blocks), and
# the mjwarp adapter overwrites dof_damping/dof_frictionloss from that
# table unconditionally for every DOF.  Consuming this file means a
# {joint_name: DriveParams} map consulted before the class fallback.
#
# THE ARMATURE TIERS ARE THE INTERESTING PART.  Normalised to J1 the
# fitted armature reads 1.000/0.991/0.375/0.377/0.189/0.189/0.188
# (left) and 1.000/0.996/0.370/0.378/0.185/0.184/0.188 (right) — three
# tiers, {J1,J2} {J3,J4} {J5,J6,J7}, identically on both arms.  The
# engine's CAD-derived classes instead give arm_shoulder and arm_mid
# the same armature=0.05 and group J5 with J3/J4, which merges two
# different motor families.  A comparable commercial arm of the same
# payload class publishes effort limits in exactly the fitted tier
# pattern (108/108/66/66/19/19/19, reproducing the ratios to <0.5%)
# while the CAD frcrange grouping is off by 1.9x on the mid tier.
# Caveat: armature and tau_max both encode the gear ratio N, so the
# tier *boundaries* are the claim here, not the absolute values.
#
# Units: armature kg*m^2, dof_damping N*m*s/rad, dof_frictionloss N*m,
# sim_kp N*m/rad, sim_kd N*m*s/rad.
#
# Caveats on the numbers: damping and frictionloss were not refit in
# this revision — they are held at the previous revision's values,
# identical to 4 decimals on all 14 joints; only the inertials were
# revised, and armature moved <=4.1%.  The shoulder frictionloss is
# the least trustworthy entry: the run's friction basis zeroes F below
# |v| < 0.02 rad/s and 42.2% of the J2 friction training points fall
# inside that band without being stationary.  See
# robots/genie/g2/xacro/G2.arm.crsB.params.sysid.xacro for the full
# caveat list, including why the link masses are not identifiable from
# this data.

