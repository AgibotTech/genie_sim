      note: vendor reference value; written explicitly so no class table supplies
        one
    frictionloss:
      value: 0.0
      note: vendor authors no frictionloss on finger joints; written explicitly
        to override the generic actuated-joint class value of 0.3, which stalled
        every finger below ~34 deg of PD error (finger-ramp sweep, 2026-08-11)
    armature:
      value: 0.0005
      note: vendor reference value for the *_joint1 knuckles, carried on all four
        phalanges; the reference authors 0.0002 on joints 2-4
    stiffness:
      value: 0.65
      note: 'selected, not fitted: top of the vendor per-actuator range (0.19-0.69),
        accepted by three empty-grasp Real2Sim replays and 24-object regressions;
        previous frozen value was 0.50'
    damping_drive:
      value: 0.05
      note: raised from the vendor midpoint 0.025 after step-response ringing in
        mjwarp - the midpoint is ~2x short of critical damping for a ~10 g effective
        fingertip inertia
