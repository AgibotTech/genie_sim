# Start with: bash source/rlinf_geniesim/scripts/start_sim_servers.sh PATH.conf
# Use --dry-run to inspect commands, --status to inspect slots, or --stop to stop them.
# Values are whitespace-separated key=value fields. code/assets may reference
# environment variables (for example, code=${SIM_REPO_ROOT}); no shell is evaluated.
# Omit code/assets to use the launcher's repository and asset-root defaults.
# Global keys: code, assets, stagger (seconds), rebuild (auto or force).
# Server keys: port, gpu, domain, fabric (0/1), headless (0/1), ready_timeout.
# ROS domains must differ. Ports 5601..5701 derive domains 1..101 by default.
# Rendering starts at client init; stagger only spreads idle server startup.

global stagger=0 rebuild=auto

server port=5601 gpu=0
server port=5602 gpu=1
server port=5603 gpu=2
server port=5604 gpu=3
server port=5605 gpu=4
server port=5606 gpu=5
server port=5607 gpu=6
server port=5608 gpu=7
