  max_steps: 2400
  action_chunk_steps: 0
  fps: 30.0
  wait_timeout: 600.0
  infer_timeout: 120.0
  output_dir: output/g2crsbwuji_dexmanip_drawstring_bag
generalization:
  material:
    selection: enumerate
    enable: true
    targets:
    - /World/Objects/drawstring_bag/shell
    allowed_materials:
    - ml_shell_00
    - ml_shell_01
    - ml_shell_02
    - ml_shell_03
    - ml_shell_04
    num: 0
