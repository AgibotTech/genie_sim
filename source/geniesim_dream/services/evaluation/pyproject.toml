[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geniesim-dream-evaluation"
version = "0.1.0"
description = "VLM evaluation service for Genie Sim Dream finished videos"
requires-python = ">=3.11,<3.14"
dependencies = [
  "accelerate>=1.0",
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.8",
  "pillow>=10",
  "transformers>=5.4",
  "torchvision>=0.25,<0.26",
  "uvicorn>=0.30,<1",
]

[project.scripts]
geniesim-dream-evaluate = "geniesim_dream_evaluation.dream_service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
