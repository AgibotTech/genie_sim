[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geniesim-dream-policy"
version = "0.1.0"
description = "OpenPI pi0.5 policy serving and Dream closed-loop bridge"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pillow>=10",
  "mujoco>=2.3.7,<4",
  "websockets>=12",
]

[project.scripts]
geniesim-dream-policy-server = "geniesim_dream_policy.server:main"
geniesim-dream-policy-bridge = "geniesim_dream_policy.bridge:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
