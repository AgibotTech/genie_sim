<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="285" viewBox="0 40 1200 285" role="img" aria-labelledby="workflowDiagramTitle workflowDiagramDescription" xmlns="http://www.w3.org/2000/svg">
  <title id="workflowDiagramTitle">Dream rollout paths</title>
  <desc id="workflowDiagramDescription">Initial observation and input actions drive policy or replay rollouts. The world model generates future observations for VLM review.</desc>
  <rect x="1" y="41" width="1198" height="283" rx="20" fill="#fbfcff" stroke="#e1e8f2" stroke-width="2"/>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; text-anchor: middle; }
    .lane-label { fill: #52657d; font-size: 14px; font-weight: 700; letter-spacing: .06em; }
    .node-label { fill: #fff; font-size: 16px; font-weight: 650; }
    .outcome-label { fill: #18212c; }
    .path-blue, .path-purple, .path-pink, .path-mint {
      fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;
    }
    .path-blue { stroke: #315fc0; }
    .path-purple { stroke: #8265d0; }
    .path-pink { stroke: #d75680; }
    .path-mint { stroke: #248e89; }
  </style>
  <defs>
    <marker id="flowArrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#315fc0"/></marker>
    <marker id="flowArrowPurple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#8265d0"/></marker>
    <marker id="flowArrowPink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#d75680"/></marker>
    <marker id="flowArrowMint" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8Z" fill="#248e89"/></marker>
  </defs>

