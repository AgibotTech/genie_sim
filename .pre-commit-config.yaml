exclude: ^(source/data_collection/|source/scene_reconstruction/patch/|source/scene_reconstruction/third_party/)
repos:
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 25.12.0 # Use the latest Black version
    hooks:
      - id: black
        exclude: .*_pb2.*\.py
        args: [
            "--diff",
            "--line-length",
            "120",
            "--exclude",
            "source/geniesim_benchmark/src/geniesim_benchmark/benchmark/config/llm_task/",
          ] # --check to Enforce check-only mode (no auto-formatting)
        types: [python] # Target Python files

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: insert-license
        files: ^.*\.py$
        exclude: ^source/(geniesim_generator/src/geniesim_generator/scene_language/|geniesim_benchmark/src/geniesim_benchmark/app/controllers/parallel_gripper\.py$|scene_reconstruction/third_party/)
        args:
          - --license-filepath
          - .github/LICENSE_HEADER.txt
          - --use-current-year

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0 # Use the ref you want to point at
    hooks:
      - id: trailing-whitespace
      - id: check-ast
      - id: check-added-large-files
      - id: check-json
      - id: check-xml
      - id: check-yaml
        args: ['--unsafe']
      - id: requirements-txt-fixer
      - id: sort-simple-yaml
      - id: pretty-format-json
        args: [--autofix]
      - id: mixed-line-ending
      - id: detect-private-key
      - id: debug-statements
        exclude: ^source/geniesim_generator/src/geniesim_generator/scene_language
      - id: check-merge-conflict
      - id: check-docstring-first
        exclude: LLM_RESULT\.py$
      - id: check-byte-order-marker # Forbid UTF-8 byte-order markers
      - id: end-of-file-fixer

  # https://blogs.halodoc.io/code-version-best-practices-with-clean-commit-formats/
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.2.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
        # `cz check` takes --allowed-prefixes as a SPACE-separated list
        # (nargs="*"), and each entry it matches SKIPS the conventional-commit
        # regex.  So list only the prefixes this repo adds on top of
        # commitizen's own types (chore, ci, docs, feat, fix, perf, refactor,
        # revert, test) — those stay regex-checked — plus `Merge`, so the
        # subjects `git merge` generates are not rejected.
        # Overriding `args` also drops the hook's own defaults, so the trailing
        # --allow-abort / --commit-msg-file pair has to be restored here, with
        # --commit-msg-file last: pre-commit appends the message path after
        # these args.
        args:
          [
            --allowed-prefixes,
            add,
            dev,
            update,
            format,
            Merge,
            --allow-abort,
            --commit-msg-file,
          ]
